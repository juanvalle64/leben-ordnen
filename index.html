<style>
:root{
 --bg:#f6f5f2;--card:#ffffff;--card2:#f0efea;--line:#e4e2dc;--text:#1c1f22;--muted:#6b7075;--faint:#9aa0a6;
 --acc:#2f7d6d;--acc2:#e3f1ed;--warn:#b86e00;--warn2:#fdf1dc;--bad:#c23b3b;--bad2:#fbe7e6;--ok:#2f7d4f;--ok2:#e2f3e8;--info:#3a63b8;--info2:#e6edfa;
 --r:16px;--r2:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
 --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
 color-scheme:light;
}
[data-theme="dark"]{--bg:#111315;--card:#1a1d20;--card2:#22262a;--line:#2c3136;--text:#eceeef;--muted:#a0a6ab;--faint:#6f767c;--acc:#5cc2a8;--acc2:#18332d;--warn:#f0b35a;--warn2:#3a2c14;--bad:#f07a74;--bad2:#3b1c1b;--ok:#6fcf97;--ok2:#17301f;--info:#8fb0f5;--info2:#1b2640;--shadow:none;color-scheme:dark}
@media (prefers-color-scheme:dark){[data-theme="auto"]{--bg:#111315;--card:#1a1d20;--card2:#22262a;--line:#2c3136;--text:#eceeef;--muted:#a0a6ab;--faint:#6f767c;--acc:#5cc2a8;--acc2:#18332d;--warn:#f0b35a;--warn2:#3a2c14;--bad:#f07a74;--bad2:#3b1c1b;--ok:#6fcf97;--ok2:#17301f;--info:#8fb0f5;--info2:#1b2640;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}.i.lg{width:26px;height:26px}
.app{min-height:100vh;display:flex}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--faint);text-decoration:none;font-size:10.5px;font-weight:600;border-radius:10px;transition:color .2s}
nav.tabs a.on{color:var(--acc)}
nav.tabs a .i{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav.tabs a.on .i{transform:translateY(-1px) scale(1.08)}
nav.tabs .brand{display:none}
main{flex:1;max-width:760px;margin:0 auto;width:100%;padding:calc(12px + var(--safe-t)) 16px calc(92px + var(--safe-b))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 14px}
header.top h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:750}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:active{transform:scale(.95)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2,.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.sec{margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:11.5px}
.big{font-size:30px;font-weight:780;letter-spacing:-.02em;line-height:1.1}
.mid{font-size:18px;font-weight:700;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}
.stat b{display:block;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.stat span{font-size:11.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:650;cursor:pointer;text-decoration:none;color:var(--text);transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme="dark"] .btn.pri{color:#06201a}
@media (prefers-color-scheme:dark){[data-theme="auto"] .btn.pri{color:#06201a}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap;text-decoration:none}
.chip.bad{background:var(--bad2);color:var(--bad)}.chip.warn{background:var(--warn2);color:var(--warn)}.chip.ok{background:var(--ok2);color:var(--ok)}.chip.info{background:var(--info2);color:var(--info)}.chip.acc{background:var(--acc2);color:var(--acc)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.item:active{background:var(--card2)}
.item .t{font-weight:650}
.item .grow,.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:var(--faint)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.info{background:var(--info)}.dot.acc{background:var(--acc)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--acc2),var(--card) 70%);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;color:var(--text)}
.hero .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:6px}
.hero .step{font-size:21px;font-weight:720;letter-spacing:-.015em;line-height:1.3;margin:10px 0 6px}
.hero .ctx{color:var(--muted);font-size:13.5px}
.hero .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty .ic,.icbox{width:54px;height:54px;border-radius:18px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;margin:0 auto 12px;flex:none}
.empty h3{color:var(--text);margin:0 0 4px;font-size:17px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center;flex:none;transition:all .2s;color:transparent;margin-top:1px}
.check input:checked+.box{background:var(--acc);border-color:var(--acc);color:#fff;animation:pop .3s}
.check input:checked~span.lbl{color:var(--faint);text-decoration:line-through}
@keyframes pop{50%{transform:scale(1.2)}}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:650;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:10px 12px;outline:none;transition:border .2s;min-width:0;font-size:16px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--acc)}
textarea.in{min-height:80px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;transition:opacity .25s;display:none}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0;font-size:19px;letter-spacing:-.01em}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.note{background:var(--warn2);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;margin:8px 0}
.note.info{background:var(--info2);color:var(--info)}
.note.bad{background:var(--bad2);color:var(--bad)}
pre.letter{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:44vh;overflow:auto;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--faint);text-align:center;font-weight:700}
.cal button{aspect-ratio:1/1;border:1px solid transparent;border-radius:11px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-weight:600;font-size:14px;padding:0}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--acc);color:var(--acc)}
.cal button.sel{background:var(--acc);color:#fff}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cal .dots i.bad{background:var(--bad)}.cal .dots i.warn{background:var(--warn)}.cal .dots i.info{background:var(--info)}
.cal button.sel .dots i{background:#fff}
.mood{display:flex;gap:6px}
.mood button{flex:1;font-size:22px;padding:6px 0;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;transition:transform .15s}
.mood button.on{background:var(--acc2);border-color:var(--acc);transform:scale(1.06)}
.flowopt{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.celebrate{animation:cel .6s ease}
@keyframes cel{30%{transform:scale(1.02)}60%{transform:scale(.99)}}
.strike{text-decoration:line-through;color:var(--faint)}
.amount{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:750;font-size:13px}
.tile{text-align:left;cursor:pointer;margin:0;display:flex;flex-direction:column;gap:8px}
.tile .icbox{width:40px;height:40px;border-radius:13px;margin:0}
.hidden{display:none!important}
@media (min-width:900px){
 nav.tabs{top:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;padding:24px 12px;border-top:0;border-right:1px solid var(--line);gap:4px}
 nav.tabs .brand{display:flex;align-items:center;gap:10px;font-weight:780;font-size:17px;padding:0 10px 18px;color:var(--text)}
 nav.tabs a{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:14.5px}
 nav.tabs a.on{background:var(--acc2)}
 main{margin-left:220px;padding:28px 32px 40px;max-width:1020px}
 .two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
 .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;border-radius:22px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:all .25s;max-height:86vh;padding-bottom:20px;pointer-events:none}
 .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
 .sheet .grab{display:none}
 .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ===== Navigation ===== */
const TABS=[["heute","Heute","sun"],["schulden","Schulden","wallet"],["fristen","Fristen","inbox"],["budget","Budget","pie"],["kalender","Termine","cal"],["hilfe","Hilfe","help"]];
let route="heute";
function nav(){$("#tabs").innerHTML=`<div class="brand">${ic("done")} Leben ordnen</div>`+TABS.map(([k,l,i])=>`<a href="#${k}" class="${route===k?"on":""}" ${route===k?'aria-current="page"':""}>${ic(i)}<span>${l}</span></a>`).join("")}
function go(r){route=TABS.some(t=>t[0]===r)?r:"heute";nav();render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
function render(){$("#main").innerHTML=`<div class="view">${VIEWS[route]()}</div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar>i[data-w]").forEach(b=>b.style.width=b.dataset.w+"%")))}
function head(title,sub,extra){return `<header class="top"><div style="min-width:0"><h1>${esc(title)}</h1>${sub?`<div class="sub">${sub}</div>`:""}</div><div class="row" style="gap:8px">${extra||""}<button class="iconbtn" data-act="settings" aria-label="Einstellungen">${ic("sliders")}</button></div></header>`}
function empty(icon,title,text,btn){return `<div class="card empty"><div class="ic">${ic(icon,"lg")}</div><h3>${esc(title)}</h3><div class="small">${text}</div>${btn?`<div style="margin-top:14px">${btn}</div>`:""}</div>`}
const X=`aria-label="Schließen"`;
const sheetHead=(t,extra)=>`<div class="sheethead"><div style="min-width:0"><h3>${t}</h3>${extra||""}</div><button class="iconbtn" data-act="close" ${X}>${ic("x")}</button></div>`;

/* ===== Berechnungen ===== */
const openDebts=()=>S.debts.filter(d=>d.status!=="bezahlt");
const paidSum=()=>S.debts.reduce((a,d)=>a+(num(d.paidAmount)||0)+d.payments.reduce((b,p)=>b+(num(p.amount)||0),0),0);
const openSum=()=>openDebts().reduce((a,d)=>a+(num(d.currentAmount)||0),0);
const unknownCount=()=>openDebts().filter(d=>num(d.currentAmount)==null).length;
const ratesSum=()=>openDebts().reduce((a,d)=>a+(num(d.rate)||0),0);
const sumL=l=>l.reduce((a,x)=>a+(num(x.amount)||0),0);
const debtName=d=>d.creditor&&!/^unbekannt/i.test(d.creditor)?d.creditor:(d.collector&&d.collector!=="direkt"?d.collector:d.creditor||"Forderung");
function candidates(){const t=today(),out=[];
 S.tasks.filter(x=>x.status!=="erledigt"&&x.status!=="wartet").forEach(x=>{const st=x.steps.findIndex(s=>!s.done);out.push({kind:"task",id:x.id,step:st,title:st>=0?x.steps[st].text:x.title,ctx:x.title,due:x.due,prio:x.priority||"mittel",uncertain:x.uncertain})});
 openDebts().forEach(d=>{if(!d.nextAction)return;if(S.tasks.some(x=>x.debtId===d.id&&x.status!=="erledigt"))return;out.push({kind:"debt",id:d.id,title:d.nextAction,ctx:debtName(d)+(d.ref?" · "+d.ref:""),due:d.nextDeadline,prio:d.status==="vollstreckung"?"hoch":"mittel",uncertain:d.uncertain})});
 const sc=c=>{const n=days(c.due);return (n==null?45:Math.max(-2,Math.min(n,60)))-(c.prio==="hoch"?30:c.prio==="mittel"?10:0)};
 return out.filter(c=>S.snooze[c.kind+c.id]!==t).sort((a,b)=>sc(a)-sc(b)||((a.due||"9")<(b.due||"9")?-1:1))}
function deadlines(){const L=[];
 S.tasks.filter(t=>t.status!=="erledigt"&&t.due).forEach(t=>L.push({date:t.due,title:t.title,kind:"task",id:t.id}));
 openDebts().filter(d=>d.nextDeadline&&!S.tasks.some(t=>t.debtId===d.id&&t.status!=="erledigt"&&t.due)).forEach(d=>L.push({date:d.nextDeadline,title:"Frist: "+debtName(d),kind:"debt",id:d.id}));
 S.events.forEach(e=>L.push({date:e.date,title:e.title,kind:"event",id:e.id,time:e.time}));
 return L.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function itemsOn(ds){const d=parse(ds),L=deadlines().filter(x=>x.date===ds);
 openDebts().filter(x=>num(x.rate)&&x.rateDay).forEach(x=>{if(+x.rateDay===d.getDate())L.push({date:ds,title:"Rate "+eur(num(x.rate))+" · "+debtName(x),kind:"rate",id:x.id})});
 S.budget.fixed.filter(f=>f.day&&+f.day===d.getDate()).forEach(f=>L.push({date:ds,title:f.label+" · "+eur(num(f.amount)),kind:"fixed"}));
 return L}

/* ===== HEUTE ===== */
function vHeute(){const p=S.profile,h=new Date().getHours();
 const greet=(h<11?"Guten Morgen":h<18?"Hallo":"Guten Abend")+(p.name?", "+p.name:"");
 if(!p.name&&!S.debts.length&&!S.tasks.length){return head("Leben ordnen","Ein Schritt nach dem anderen.")+`<div class="card"><div class="empty" style="padding:10px"><div class="ic">${ic("heart","lg")}</div><h3>Willkommen</h3><div class="small">Hier sammelst du Briefe, Schulden und Fristen – und siehst jeden Tag nur <b>einen</b> nächsten Schritt. Alles bleibt auf diesem Gerät.</div></div>
  <form data-form="onboard"><label class="f"><span>Wie heißt du?</span><input class="in" name="name" placeholder="Vorname" autocomplete="given-name"></label><button class="btn pri block">Los geht's ${ic("arrow")}</button></form>
  <div class="row" style="margin-top:10px;justify-content:center"><button class="btn ghost sm" data-act="import">${ic("upload","sm")} Sicherung importieren</button></div></div>`}
 const c=candidates(),n=c[0];let hero;
 if(n){const u=urg(n.due);hero=`<div class="hero" id="hero"><div class="lab">${ic("target","sm")} Dein nächster Schritt</div>
   <div class="step">${esc(n.title)}</div><div class="ctx">${esc(n.ctx)}</div>
   <div class="row wrap" style="margin-top:8px;gap:6px">${n.due?`<span class="chip ${u}">${ic("clock","sm")} ${fshort(n.due)} · ${rel(n.due)}</span>`:""}${n.prio==="hoch"?`<span class="chip bad">Wichtig</span>`:""}${n.uncertain?`<span class="chip warn">unsicher</span>`:""}</div>
   <div class="acts"><button class="btn pri" data-act="stepdone" data-kind="${n.kind}" data-id="${n.id}" data-step="${n.step??""}">${ic("check")} Erledigt</button>
   <button class="btn" data-act="open-${n.kind}" data-id="${n.id}">Details</button>
   <button class="btn ghost" data-act="snooze" data-key="${n.kind+n.id}">${ic("skip","sm")} Später</button></div>
   ${c.length>1?`<div class="tiny muted" style="margin-top:10px">Danach warten noch ${c.length-1} Schritte – aber jetzt zählt nur dieser.</div>`:""}</div>`}
 else hero=`<div class="hero"><div class="lab">${ic("done","sm")} Alles im Griff</div><div class="step">Gerade steht nichts an.</div><div class="ctx">Neuer Brief gekommen? Erfasse ihn in 30 Sekunden.</div><div class="acts"><button class="btn pri" data-act="capture">${ic("plus")} Brief erfassen</button></div></div>`;
 const week=deadlines().filter(x=>{const d=days(x.date);return d!=null&&d>=0&&d<=7}).length,over=deadlines().filter(x=>days(x.date)<0).length;
 const doneT=S.tasks.filter(t=>t.status==="erledigt").length;
 const stats=`<div class="grid3"><div class="stat"><b>${eur(openSum())}</b><span>offen (bekannt)</span></div><div class="stat"><b>${week}${over?` <span style="color:var(--bad);font-size:13px">+${over} fällig</span>`:""}</b><span>Fristen ≤ 7 Tage</span></div><div class="stat"><b>${doneT}</b><span>erledigt</span></div></div>`;
 const up=deadlines().filter(x=>days(x.date)<=14).slice(0,5);
 const upl=up.length?`<div class="sec">Als Nächstes</div><div class="list">${up.map(x=>`<button class="item" data-act="open-${x.kind}" data-id="${x.id}"><span class="dot ${urg(x.date)}"></span><div class="grow"><div class="t ellip">${esc(x.title)}</div><div class="small muted">${fdate(x.date)} · ${rel(x.date)}</div></div>${ic("chevR","sm")}</button>`).join("")}</div>`:"";
 const oq=S.openQuestions.length?`<div class="card"><h2>Offene Fragen</h2>${S.openQuestions.map((q,i)=>`<div class="row between" style="align-items:flex-start;padding:7px 0;border-top:${i?"1px solid var(--line)":"0"}"><div class="small">${esc(q)}</div><button class="iconbtn" style="width:30px;height:30px" data-act="qdone" data-i="${i}" aria-label="Geklärt">${ic("check","sm")}</button></div>`).join("")}</div>`:"";
 return head(greet,fdate(today()))+`<div class="two"><div>${hero}${stats}${upl}</div><div>${dayCheck()}${weekCheck()}${oq}</div></div>`}
function dayCheck(){const t=today(),morning=new Date().getHours()<14,type=morning?"morgen":"abend";
 const ex=S.checks.find(c=>c.date===t&&c.type===type);
 if(ex)return `<div class="card"><div class="row between"><h2 style="margin:0">${morning?"Morgen":"Abend"}-Check</h2><span class="chip ok">${ic("check","sm")} erledigt</span></div>${ex.text?`<div class="small muted" style="margin-top:6px">„${esc(ex.text)}“</div>`:""}</div>`;
 const moods=["😞","🙁","😐","🙂","😄"];
 return `<form class="card" data-form="daycheck"><input type="hidden" name="type" value="${type}"><input type="hidden" name="mood" value=""><h2 class="row" style="gap:6px">${morning?ic("sun","sm")+" Morgen":ic("moon","sm")+" Abend"}-Check <span class="faint" style="text-transform:none;letter-spacing:0">· 20 Sek.</span></h2>
 <div class="small muted" style="margin-bottom:6px">${morning?"Wie fühlst du dich?":"Wie war dein Tag?"}</div><div class="mood">${moods.map((m,i)=>`<button type="button" data-act="mood" data-v="${i+1}" aria-label="Stimmung ${i+1}">${m}</button>`).join("")}</div>
 <label class="f" style="margin-top:10px"><span>${morning?"Was ist heute das Wichtigste?":"Was hast du heute geschafft?"}</span><input class="in" name="text" placeholder="Ein Satz reicht"></label>
 ${morning?"":`<label class="check"><input type="checkbox" name="post"><span class="box">${ic("check","sm")}</span><span class="lbl small">Post und Mails angeschaut</span></label>`}
 <button class="btn sm pri">Speichern</button></form>`}
const WEEK_ITEMS=["Neue Post und Mails geöffnet und erfasst","Kontostand angeschaut","Fristen der nächsten 14 Tage gesehen","Fällige Raten bezahlt","Eine Sache für nächste Woche festgelegt"];
function weekCheck(){const last=S.checks.filter(c=>c.type==="woche").sort((a,b)=>a.date<b.date?1:-1)[0];
 const due=!last||days(last.date)<=-7;
 return `<div class="card"><div class="row between"><div><h2 style="margin:0 0 2px">Wochen-Check</h2><div class="small muted">${last?"Zuletzt "+fdate(last.date):"Noch nie gemacht"} · 5 Minuten</div></div>${due?`<button class="btn sm pri" data-act="weekcheck">Starten</button>`:`<span class="chip ok">${ic("check","sm")} diese Woche</span>`}</div></div>`}
/* ===== SCHULDEN ===== */
function plan(){const st=S.settings.strategy,L=openDebts().filter(d=>num(d.currentAmount)>0);
 L.sort((a,b)=>st==="lawine"?((num(b.interest)||0)-(num(a.interest)||0)||num(b.currentAmount)-num(a.currentAmount)):num(a.currentAmount)-num(b.currentAmount));
 const B=num(S.budget.debtBudget);let months=null,warn="";
 if(B&&L.length){const rates=L.reduce((a,d)=>a+(num(d.rate)||0),0);if(rates>B)warn="Deine vereinbarten Raten ("+eur(rates)+") sind höher als das Monatsbudget.";
  const bal=L.map(d=>num(d.currentAmount));let m=0;
  while(bal.some(b=>b>0.005)&&m<600){m++;let money=B;L.forEach((d,i)=>{if(bal[i]>0){const r=Math.min(num(d.rate)||0,bal[i],money);bal[i]-=r;money-=r}});for(let i=0;i<bal.length&&money>0.005;i++){if(bal[i]>0){const r=Math.min(bal[i],money);bal[i]-=r;money-=r}}}
  months=bal.some(b=>b>0.005)?null:m}
 return {L,B,months,warn}}
function vSchulden(){
 if(!S.debts.length)return head("Schulden")+empty("wallet","Noch keine Forderungen","Trag jede Forderung ein – auch ohne Betrag. Der Überblick allein nimmt schon Druck raus.",`<button class="btn pri" data-act="debt-new">${ic("plus")} Forderung hinzufügen</button>`);
 const open=openSum(),paid=paidSum(),pct=open+paid>0?Math.round(paid/(open+paid)*100):0,unk=unknownCount();
 const P=plan(),st=S.settings.strategy;
 const top=`<div class="card"><div class="row between" style="align-items:flex-start"><div><div class="small muted">Offen (nur bekannte Beträge)</div><div class="big">${eur(open)}</div><div class="small muted">${openDebts().length} offene Fälle${unk?` · <span style="color:var(--warn)">${unk} ohne Betrag</span>`:""}</div></div><div class="ring" style="background:conic-gradient(var(--acc) ${pct}%,var(--card2) 0)"><div>${pct}%</div></div></div>
 <div class="bar" style="margin-top:12px"><i data-w="${pct}"></i></div><div class="row between tiny muted" style="margin-top:4px"><span>Bezahlt ${eur(paid)}</span><span>Raten/Monat ${eur(ratesSum())}</span></div></div>`;
 const strat=`<div class="card"><h2>Strategie</h2><div class="seg"><button class="${st==="schneeball"?"on":""}" data-act="strategy" data-v="schneeball">❄︎ Schneeball</button><button class="${st==="lawine"?"on":""}" data-act="strategy" data-v="lawine">▲ Lawine</button></div>
 <div class="small muted" style="margin:8px 0 10px">${st==="schneeball"?"Kleinste Forderung zuerst – schnelle Erfolge, weniger Briefe.":"Höchster Zinssatz zuerst – spart am meisten Geld (Zinssatz im Fall eintragen)."} Fälle mit Vollstreckung oder Strom-/Mietsperre immer zuerst sichern.</div>
 <form data-form="debtbudget" class="row" style="align-items:flex-end"><label class="f" style="margin:0;flex:1"><span>Monatliches Schulden-Budget (€)</span><input class="in" name="b" inputmode="decimal" placeholder="Was du sicher zahlen kannst" value="${P.B==null?"":String(P.B).replace(".",",")}"></label><button class="btn">OK</button></form>
 ${P.warn?`<div class="note bad">${ic("alert","sm")} ${esc(P.warn)}</div>`:""}
 ${P.B&&P.months!=null?`<div class="note info">${ic("target","sm")} <div>Mit ${eur(P.B)}/Monat wären die bekannten Beträge in etwa <b>${P.months} Monaten</b> weg (ohne Zinsen, ohne Fälle ohne Betrag).</div></div>`:""}
 ${P.L.length?`<div class="small" style="margin-top:10px"><b>Reihenfolge:</b><ol style="margin:6px 0 0;padding-left:20px">${P.L.slice(0,6).map(d=>`<li>${esc(debtName(d))} <span class="muted">(${eur(num(d.currentAmount))})</span></li>`).join("")}</ol>${P.L.length>6?`<div class="tiny muted">… und ${P.L.length-6} weitere</div>`:""}</div>`:""}</div>`;
 const order={vollstreckung:0,tituliert:1,offen:1,ratenantrag:2,raten:3,strittig:4,klaeren:5,bezahlt:9};
 const L=[...S.debts].sort((a,b)=>(order[a.status]??5)-(order[b.status]??5)||(num(b.currentAmount)||0)-(num(a.currentAmount)||0));
 const rows=L.map(d=>{const amt=d.status==="bezahlt"?(num(d.paidAmount)!=null?eur(num(d.paidAmount)):"✓"):num(d.currentAmount)!=null?eur(num(d.currentAmount)):"?";
  return `<button class="item" data-act="open-debt" data-id="${d.id}"><span class="dot ${(STATUS[d.status]||[])[1]||""}"></span><div class="grow"><div class="row between"><div class="t ellip">${esc(debtName(d))}</div><div class="amount ${d.status==="bezahlt"?"strike":""}">${amt}</div></div>
  <div class="small muted ellip">${esc(d.collectorType&&d.collectorType!=="direkt"?d.collector:"direkt")}${d.ref?" · "+esc(d.ref):""}</div>
  <div class="row wrap" style="gap:6px;margin-top:5px">${chip(d.status)}${d.nextDeadline&&d.status!=="bezahlt"?`<span class="chip ${urg(d.nextDeadline)}">${ic("clock","sm")} ${fshort(d.nextDeadline)}</span>`:""}${num(d.rate)?`<span class="chip acc">${eur(num(d.rate))}/Monat</span>`:""}${d.uncertain?`<span class="chip warn">unsicher</span>`:""}</div></div></button>`}).join("");
 return head("Schulden","Überblick, Raten und Plan",`<button class="iconbtn" data-act="debt-new" aria-label="Forderung hinzufügen">${ic("plus")}</button>`)+`<div class="two"><div>${top}<div class="sec">Alle Fälle</div><div class="list">${rows}</div></div><div>${strat}</div></div>`}
function debtSheet(id){const d=S.debts.find(x=>x.id===id);if(!d)return;const c=d.contact;
 const tel=c.phone?c.phone.replace(/\(.*?\)/g,"").replace(/[^\d+]/g,""):"";
 const kv=[["Gläubiger",d.creditor],["Ursprünglich",d.originalCreditor],["Über",(CTYPE[d.collectorType]||"")+(d.collector&&d.collector!=="direkt"?" – "+d.collector:"")],["Aktenzeichen",d.ref],["Ursprungsbetrag",num(d.originalAmount)!=null?eur(num(d.originalAmount)):""],["Aktuell",num(d.currentAmount)!=null?eur(num(d.currentAmount))+(d.amountDate?" (Stand "+fshort(d.amountDate)+parse(d.amountDate).getFullYear()+")":""):"unbekannt"],["Rate",num(d.rate)?eur(num(d.rate))+(d.rateDay?" am "+d.rateDay+". des Monats":""):""],["Zinssatz",num(d.interest)!=null?String(d.interest).replace(".",",")+" % p. a.":""],["Nächste Frist",d.nextDeadline?fdate(d.nextDeadline)+" · "+rel(d.nextDeadline):""],["Letzte Mail",d.lastMail?fdate(d.lastMail):""],["Telefon",c.phone],["E-Mail",c.email],["IBAN",c.iban],["Verwendungszweck",c.purpose]].filter(x=>x[1]);
 openSheet(sheetHead(esc(debtName(d)),`<div class="row" style="gap:6px;margin-top:4px">${chip(d.status)}${d.uncertain?`<span class="chip warn">unsicher</span>`:""}</div>`)+`
 ${d.nextAction&&d.status!=="bezahlt"?`<div class="note info">${ic("target","sm")} <div><b>Nächster Schritt:</b> ${esc(d.nextAction)}</div></div>`:""}
 ${d.uncertain&&d.uncertainNote?`<div class="note">${ic("alert","sm")} <div>${esc(d.uncertainNote)}</div></div>`:""}
 <div class="card"><dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>${d.notes?`<div class="small muted" style="margin-top:10px">${esc(d.notes)}</div>`:""}</div>
 <div class="grid2">${tel?`<a class="btn" href="tel:${esc(tel)}">${ic("phone","sm")} Anrufen</a>`:""}${c.email?`<a class="btn" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(d.ref?"Az. "+d.ref:"Forderung")}">${ic("mail","sm")} E-Mail</a>`:""}${c.iban?`<button class="btn" data-act="copy" data-text="${esc(c.iban.replace(/\s/g,""))}">${ic("copy","sm")} IBAN kopieren</button>`:""}<button class="btn" data-act="letters" data-k="rate" data-id="${d.id}">${ic("file","sm")} Brief-Vorlage</button><button class="btn" data-act="payment" data-id="${d.id}">${ic("check","sm")} Zahlung eintragen</button><button class="btn" data-act="debt-edit" data-id="${d.id}">${ic("edit","sm")} Bearbeiten</button></div>
 ${d.payments.length?`<div class="sec">Zahlungen</div><div class="list">${d.payments.map(p=>`<div class="item" style="cursor:default"><div class="grow">${fdate(p.date)}${p.note?` · <span class="muted">${esc(p.note)}</span>`:""}</div><div class="amount">${eur(num(p.amount))}</div></div>`).join("")}</div>`:""}

function vFristen(){const open=S.tasks.filter(t=>t.status!=="erledigt"),done=S.tasks.filter(t=>t.status==="erledigt");
 const capture=`<button class="hero" style="width:100%;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center;font:inherit" data-act="capture"><div class="icbox" style="margin:0">${ic("inbox","lg")}</div><div><div class="mid">Brief erfassen</div><div class="small muted">Was ist es? · Was tun? · Bis wann? – daraus wird eine Checkliste.</div></div></button>`;
 if(!S.tasks.length)return head("Fristen & Papierkram")+capture+empty("done","Posteingang leer","Sobald ein Brief kommt: oben erfassen. Du bekommst eine geführte Checkliste.");
 const gk=t=>{const n=days(t.due);return n!=null&&n<0?(t.priority==="hoch"?0:1):2};open.sort((a,b)=>gk(a)-gk(b)||((a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0));
 const card=t=>{const n=t.steps.length,k=t.steps.filter(s=>s.done).length,pct=n?Math.round(k/n*100):0;
  return `<div class="card" id="task-${t.id}"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div style="font-weight:700">${esc(t.title)}</div><div class="row wrap" style="gap:6px;margin-top:5px">${t.due?`<span class="chip ${urg(t.due)}">${ic("clock","sm")} ${fshort(t.due)} · ${rel(t.due)}</span>`:`<span class="chip">ohne Frist</span>`}${t.category?`<span class="chip">${esc(t.category)}</span>`:""}${t.priority==="hoch"?`<span class="chip bad">Wichtig</span>`:""}${t.status==="wartet"?`<span class="chip info">wartet auf Antwort</span>`:""}${t.uncertain?`<span class="chip warn">unsicher</span>`:""}</div></div><button class="iconbtn" style="width:34px;height:34px" data-act="task-edit" data-id="${t.id}" aria-label="Bearbeiten">${ic("edit","sm")}</button></div>
  ${t.notes?`<div class="small muted" style="margin-top:8px">${esc(t.notes)}</div>`:""}
  <div style="margin-top:6px">${t.steps.map((s,i)=>`<label class="check"><input type="checkbox" data-act="step" data-id="${t.id}" data-i="${i}" ${s.done?"checked":""}><span class="box">${ic("check","sm")}</span><span class="lbl small">${esc(s.text)}</span></label>`).join("")}</div>
  ${t.sourceNote?`<div class="tiny faint">Quelle: ${esc(t.sourceNote)}</div>`:""}
  ${n?`<div class="bar" style="margin-top:6px"><i data-w="${pct}"></i></div>`:""}
  <div class="row wrap" style="gap:6px;margin-top:10px">${t.debtId&&S.debts.some(d=>d.id===t.debtId)?`<button class="btn sm" data-act="open-debt" data-id="${t.debtId}">${ic("wallet","sm")} Forderung</button>`:""}${t.source?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://mail.google.com/mail/u/0/#all/${encodeURIComponent(t.source)}">${ic("ext","sm")} Mail</a>`:""}<button class="btn sm ghost" data-act="task-done" data-id="${t.id}">${ic("done","sm")} Fertig</button></div></div>`};
 return head("Fristen & Papierkram",open.length+" offen")+capture+`<div class="sec">Offen</div>${open.length?open.map(card).join(""):empty("done","Alles erledigt","Stark! Neue Post? Einfach oben erfassen.")}
 ${done.length?`<details class="card"><summary class="small muted" style="cursor:pointer">Erledigt (${done.length})</summary>${done.map(t=>`<div class="row between" style="padding:8px 0;border-top:1px solid var(--line)"><span class="small strike">${esc(t.title)}</span><button class="btn sm ghost" data-act="task-reopen" data-id="${t.id}">Wieder öffnen</button></div>`).join("")}</details>`:""}`}

function vBudget(){const B=S.budget,inc=sumL(B.income),fix=sumL(B.fixed),rates=ratesSum(),free=inc-fix-rates;
 const sec=(k,title,list,hint)=>`<div class="card"><div class="row between"><h2 style="margin:0">${title}</h2><span class="amount">${eur(sumL(list))}</span></div>
  ${list.length?`<div style="margin-top:8px">${list.map(x=>`<div class="row between" style="padding:7px 0;border-top:1px solid var(--line)"><div class="small">${esc(x.label)}${x.day?` <span class="faint">· am ${esc(x.day)}.</span>`:""}</div><div class="row" style="gap:6px"><span class="amount small">${eur(num(x.amount))}</span><button class="iconbtn" style="width:28px;height:28px" data-act="bdel" data-k="${k}" data-id="${x.id}" aria-label="Entfernen">${ic("x","sm")}</button></div></div>`).join("")}</div>`:`<div class="small muted" style="margin:6px 0">${hint}</div>`}
  <form data-form="badd" data-k="${k}" class="row" style="margin-top:8px;gap:6px"><input class="in" name="label" placeholder="Bezeichnung" style="flex:2" aria-label="Bezeichnung"><input class="in" name="amount" placeholder="€" inputmode="decimal" style="flex:1" aria-label="Betrag">${k==="fixed"?`<input class="in" name="day" placeholder="Tag" inputmode="numeric" style="width:62px;flex:none" aria-label="Tag im Monat">`:""}<button class="iconbtn" aria-label="Hinzufügen">${ic("plus")}</button></form></div>`;
 const has=B.income.length||B.fixed.length;
 const top=has?`<div class="card"><div class="small muted">Frei verfügbar pro Monat</div><div class="big" style="color:${free<0?"var(--bad)":"var(--ok)"}">${eur(free)}</div>
  <div class="grid3" style="margin-top:12px"><div class="stat"><b>${eur(inc)}</b><span>Einnahmen</span></div><div class="stat"><b>${eur(fix)}</b><span>Fixkosten</span></div><div class="stat"><b>${eur(rates)}</b><span>Raten</span></div></div>
  ${free<0?`<div class="note bad">${ic("alert","sm")} <div>Es fehlt Geld. Keine höheren Raten zusagen, als du zahlen kannst – Schuldnerberatung hilft kostenlos (Tab „Hilfe“).</div></div>`:inc?`<div class="note info">${ic("spark","sm")} <div>Plane einen Puffer ein und nimm nur einen Teil davon als Schulden-Budget.</div></div>`:""}</div>`
  :empty("pie","Dein Monat auf einen Blick","Trag Einnahmen und Fixkosten ein. Raten kommen automatisch aus dem Schulden-Tab.");
 const rl=openDebts().filter(d=>num(d.rate));
 return head("Budget","Einnahmen · Fixkosten · Raten · Frei")+top+`<div class="two"><div>${sec("income","Einnahmen",B.income,"z. B. Gehalt, Kindergeld, Nebenjob")}${sec("fixed","Fixkosten",B.fixed,"z. B. Miete, Strom, Handy, Versicherung")}</div><div><div class="card"><div class="row between"><h2 style="margin:0">Raten</h2><span class="amount">${eur(rates)}</span></div>${rl.length?rl.map(d=>`<div class="row between" style="padding:7px 0;border-top:1px solid var(--line)"><span class="small">${esc(debtName(d))}${d.rateDay?` <span class="faint">· am ${d.rateDay}.</span>`:""}</span><span class="amount small">${eur(num(d.rate))}</span></div>`).join(""):`<div class="small muted" style="margin-top:6px">Noch keine Raten eingetragen. Trag sie im jeweiligen Fall ein.</div>`}</div></div></div>`}

let calM=null,calSel=null;
function vKalender(){const t=parse(today());if(!calM)calM=new Date(t.getFullYear(),t.getMonth(),1);if(!calSel)calSel=today();
 const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
 let cells="";for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),s=iso(d),it=itemsOn(s);
  cells+=`<button class="${d.getMonth()!==m?"out":""} ${s===today()?"today":""} ${s===calSel?"sel":""}" data-act="calday" data-d="${s}" aria-label="${fdate(s)}">${d.getDate()}<span class="dots">${it.slice(0,3).map(x=>`<i class="${x.kind==="rate"||x.kind==="fixed"?"":urg(x.date)}"></i>`).join("")}</span></button>`}
 const sel=itemsOn(calSel),up=deadlines().filter(x=>days(x.date)>=0).slice(0,8),over=deadlines().filter(x=>days(x.date)<0);
 const act=x=>x.kind==="event"?"event-del":x.kind==="rate"?"open-debt":x.kind==="fixed"?"noop":"open-"+x.kind;
 return head("Termine","Fristen, Raten und Termine",`<button class="iconbtn" data-act="event-new" aria-label="Termin hinzufügen">${ic("plus")}</button>`)+`<div class="two"><div><div class="card"><div class="row between" style="margin-bottom:10px"><button class="iconbtn" data-act="calnav" data-v="-1" aria-label="Voriger Monat">${ic("chevL")}</button><div class="mid">${MON[m]} ${y}</div><button class="iconbtn" data-act="calnav" data-v="1" aria-label="Nächster Monat">${ic("chevR")}</button></div>
 <div class="cal">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>`<div class="h">${x}</div>`).join("")}${cells}</div></div>
 <div class="sec">${fdate(calSel)}</div>${sel.length?`<div class="list">${sel.map(x=>`<button class="item" data-act="${act(x)}" data-id="${x.id||""}"><span class="dot ${x.kind==="rate"||x.kind==="fixed"?"ok":urg(x.date)}"></span><div class="grow"><div class="t">${esc(x.title)}</div>${x.time?`<div class="small muted">${esc(x.time)} Uhr</div>`:""}</div>${x.kind==="event"?ic("trash","sm"):""}</button>`).join("")}</div>`:`<div class="card small muted row between">Nichts an diesem Tag. <button class="btn sm" data-act="event-new" data-d="${calSel}">${ic("plus","sm")} Termin</button></div>`}</div>
 <div>${over.length?`<div class="sec">Überfällig</div><div class="list">${over.map(x=>`<button class="item" data-act="${act(x)}" data-id="${x.id}"><span class="dot bad"></span><div class="grow"><div class="t ellip">${esc(x.title)}</div><div class="small muted">${fdate(x.date)} · ${rel(x.date)}</div></div></button>`).join("")}</div>`:""}
 <div class="sec">Demnächst</div>${up.length?`<div class="list">${up.map(x=>`<button class="item" data-act="calday" data-d="${x.date}"><span class="dot ${urg(x.date)}"></span><div class="grow"><div class="t ellip">${esc(x.title)}</div><div class="small muted">${fdate(x.date)} · ${rel(x.date)}</div></div></button>`).join("")}</div>`:empty("cal","Keine kommenden Termine","Fristen aus Briefen und eigene Termine erscheinen hier.")}</div></div>`}

 const to=d?((d.collectorType!=="direkt"&&d.collector?d.collector:d.creditor)||"[Empfänger]"):"[Empfänger]";
 const az=d&&d.ref?d.ref:"[Aktenzeichen]",gl=d&&d.creditor&&!/^unbekannt/i.test(d.creditor)?d.creditor:"";

 const H=`${nm}\n${adr}\n\n${to}\n\n${new Date().toLocaleDateString("de-DE")}\n\n`;
 if(k==="rate")return H+`Ihr Zeichen: ${az}${gl?"\nGläubiger: "+gl:""}\nBetreff: Bitte um Ratenzahlung\n\nSehr geehrte Damen und Herren,\n\nich bin derzeit nicht in der Lage, den geforderten Betrag von ${amt} in einer Summe zu zahlen.\n\nIch biete Ihnen eine monatliche Rate von [Betrag] € an, zahlbar jeweils zum [Tag]. des Monats, beginnend am [Datum].\n\nBitte bestätigen Sie mir die Ratenvereinbarung schriftlich und sehen Sie für die Dauer der Ratenzahlung von weiteren Maßnahmen und zusätzlichen Kosten ab. Bitte senden Sie mir außerdem eine aktuelle Forderungsaufstellung.\n\nMit freundlichen Grüßen\n\n${nm}`;
 if(k==="nachweis")return H+`Ihr Zeichen: ${az}${gl?"\nGläubiger: "+gl:""}\nBetreff: Bitte um Forderungsnachweis – Forderung bestritten\n\nSehr geehrte Damen und Herren,\n\nzu Ihrem Schreiben bitte ich um einen vollständigen Nachweis Ihrer Forderung (${amt}):\n\n1. Name des ursprünglichen Gläubigers und Grund der Forderung (Vertrag/Rechnung mit Datum)\n2. Nachweis Ihrer Beauftragung bzw. der Abtretung\n3. Aufstellung nach Hauptforderung, Zinsen (Zeitraum, Zinssatz) und Kosten\n4. Bereits geleistete Zahlungen\n\nBis zur Vorlage dieser Unterlagen bestreite ich die Forderung dem Grunde und der Höhe nach. Eine Zahlung oder ein Anerkenntnis ist mit diesem Schreiben nicht verbunden.\n\nMit freundlichen Grüßen\n\n${nm}`;
 return H+`Ihr Zeichen: ${az}\nBetreff: Bitte um Fristverlängerung\n\nSehr geehrte Damen und Herren,\n\nzu Ihrem Schreiben vom [Datum] bitte ich um Verlängerung der Frist bis zum [neues Datum].\n\nGrund: [kurze Begründung, z. B. Unterlagen werden noch beschafft].\n\nVielen Dank für Ihr Verständnis. Bitte bestätigen Sie mir die Verlängerung kurz.\n\nMit freundlichen Grüßen\n\n${nm}`}

async function unlockVault(pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function vLock(){return `<header class="top"><div><h1>Leben ordnen</h1><div class="sub">Ein Schritt nach dem anderen.</div></div></header><div class="card"><div class="empty" style="padding:10px"><div class="ic">${ic("shield","lg")}</div><h3>Deine Daten sind verschlüsselt</h3><div class="small">Gib dein Passwort ein. Danach bleiben die Daten nur auf diesem Gerät.</div></div>
 <form data-form="unlock"><label class="f"><span>Passwort</span><input class="in" name="pw" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="wort-wort-wort-wort-1234"></label><button class="btn pri block" id="unlockBtn">${ic("check")} Entsperren</button></form>
 <div class="small muted" id="unlockMsg" style="margin-top:8px;min-height:18px"></div>
 <div class="row" style="justify-content:center;margin-top:6px"><button class="btn ghost sm" data-act="skipvault">Ohne Startdaten beginnen</button></div></div>`}
const _render=render;
render=function(){if(LOCKED){$("#tabs").style.display="none";$("#main").innerHTML=`<div class="view">${vLock()}</div>`;return}$("#tabs").style.display="";_render()};
document.addEventListener("submit",async e=>{const f=e.target;if(f.dataset.form!=="unlock")return;e.preventDefault();e.stopImmediatePropagation();
 const pw=(f.elements.pw.value||"").trim().toLowerCase(),msg=$("#unlockMsg"),btn=$("#unlockBtn");if(!pw)return;btn.disabled=true;msg.textContent="Entschlüssele …";
 try{const d=await unlockVault(pw);S=normalize(d);save();localStorage.setItem(UKEY,"1");LOCKED=false;applyTheme();nav();render();toast("Willkommen zurück"+(S.profile.name?", "+S.profile.name:"")+"!")}
 catch(x){btn.disabled=false;msg.textContent="Passwort stimmt nicht – bitte genau so eingeben, mit Bindestrichen."}},true);
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;
 if(el.dataset.act==="skipvault"){localStorage.setItem(UKEY,"skip");LOCKED=false;render()}
 if(el.dataset.act==="relock"){if(confirm("Startdaten mit Passwort neu laden? Deine Änderungen werden nach dem Entsperren ersetzt (vorher exportieren!).")){localStorage.removeItem(UKEY);LOCKED=true;closeSheet();render()}}},true);
if(VAULT){const _ss=settingsSheet;settingsSheet=function(){_ss();const g=document.querySelector("#sheet .grid2:last-of-type");if(g)g.insertAdjacentHTML("beforeend",`<button class="btn" data-act="relock">${ic("shield","sm")} Startdaten (Passwort)</button>`)}}
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js",{scope:location.pathname}).catch(()=>{})}

applyTheme();go(location.hash.slice(1)||"heute");
</script>
</body>
</html>
